<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  MANX wordmark — horizontal lockup with tagline.
  Use this in README banners, docs, marketing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="MANX — Multiscreen Arcade Nexus">
  <defs>
    <linearGradient id="marqueeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6567f"/>
      <stop offset="0.5" stop-color="#f9e2af"/>
      <stop offset="1" stop-color="#37cfd3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafeff"/>
      <stop offset="1" stop-color="#37cfd3"/>
    </linearGradient>
  </defs>

  <!-- Background tile (transparent by default; uncomment rect for a filled card) -->
  <!-- <rect width="100%" height="100%" fill="#0b0e13"/> -->

  <!-- Three-screen cluster to the left -->
  <g transform="translate(40,40)">
    <g transform="rotate(-6 30 80)">
      <rect x="0" y="20" width="48" height="120" rx="9" fill="#0a6b6f" stroke="#37cfd3" stroke-width="3"/>
    </g>
    <g>
      <rect x="48" y="14" width="60" height="132" rx="9" fill="#0f8f93" stroke="#37cfd3" stroke-width="3.5"/>
    </g>
    <g transform="rotate(6 138 80)">
      <rect x="108" y="20" width="48" height="120" rx="9" fill="#0a6b6f" stroke="#37cfd3" stroke-width="3"/>
    </g>
  </g>

  <!-- MANX wordmark -->
  <text x="265" y="135"
        font-family="'Press Start 2P','VT323','JetBrainsMono Nerd Font','Courier New',monospace"
        font-size="110" font-weight="700"
        fill="url(#textGrad)"
        letter-spacing="6">MANX</text>

  <!-- Marquee underline -->
  <rect x="265" y="160" width="430" height="14" rx="6" fill="url(#marqueeGrad)"/>

  <!-- Tagline -->
  <text x="265" y="205"
        font-family="'JetBrainsMono Nerd Font','Inter',sans-serif"
        font-size="22" font-weight="500"
        fill="#cdd6f4"
        letter-spacing="6">MULTISCREEN ARCADE NEXUS</text>
</svg>
