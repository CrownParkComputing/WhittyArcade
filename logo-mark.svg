<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  MANX mark — app icon.
  Evolved from the WhittyArcade square: same rounded-square silhouette
  and CRT-scanline mood, but with three screens for the multiscreen
  angle and the MANX letters in the centre marquee.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="MANX mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161d"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f8f93"/>
      <stop offset="1" stop-color="#0a6b6f"/>
    </linearGradient>
    <linearGradient id="marquee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6567f"/>
      <stop offset="0.5" stop-color="#f9e2af"/>
      <stop offset="1" stop-color="#37cfd3"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)" stroke="#37cfd3" stroke-width="3"/>

  <!-- Faint scanlines, only on the marquee area -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <line x1="14" y1="20" x2="114" y2="20"/>
    <line x1="14" y1="28" x2="114" y2="28"/>
  </g>

  <!-- Marquee strip at the top, holds the MANX letters -->
  <rect x="14" y="14" width="100" height="22" rx="6" fill="url(#marquee)" opacity="0.95"/>
  <text x="64" y="32"
        font-family="'Press Start 2P','VT323','JetBrainsMono Nerd Font',monospace"
        font-size="14" font-weight="700"
        text-anchor="middle" fill="#0b0e13"
        letter-spacing="1">MANX</text>

  <!-- Three screens for the multiscreen angle -->
  <g>
    <!-- Left screen (slight tilt out) -->
    <g transform="rotate(-6 30 72)">
      <rect x="16" y="48" width="32" height="38" rx="5" fill="url(#screen)" stroke="#37cfd3" stroke-width="1.5"/>
      <line x1="16" y1="56" x2="48" y2="56" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="16" y1="64" x2="48" y2="64" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="16" y1="72" x2="48" y2="72" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="16" y1="80" x2="48" y2="80" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- Centre screen (largest, focus) -->
    <g>
      <rect x="48" y="46" width="32" height="40" rx="5" fill="url(#screen)" stroke="#37cfd3" stroke-width="2"/>
      <line x1="48" y1="54" x2="80" y2="54" stroke="#8fe9ec" stroke-width="1" opacity="0.5"/>
      <line x1="48" y1="62" x2="80" y2="62" stroke="#8fe9ec" stroke-width="1" opacity="0.5"/>
      <line x1="48" y1="70" x2="80" y2="70" stroke="#8fe9ec" stroke-width="1" opacity="0.5"/>
      <line x1="48" y1="78" x2="80" y2="78" stroke="#8fe9ec" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Right screen (slight tilt in) -->
    <g transform="rotate(6 98 72)">
      <rect x="80" y="48" width="32" height="38" rx="5" fill="url(#screen)" stroke="#37cfd3" stroke-width="1.5"/>
      <line x1="80" y1="56" x2="112" y2="56" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="80" y1="64" x2="112" y2="64" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="80" y1="72" x2="112" y2="72" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="80" y1="80" x2="112" y2="80" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
    </g>
  </g>

  <!-- Base (cabinet body) -->
  <ellipse cx="64" cy="108" rx="40" ry="10" fill="#0f141b"/>
  <rect x="24" y="92" width="80" height="18" rx="8" fill="#243040"/>
  <rect x="24" y="92" width="80" height="9" rx="5" fill="#2f3d50"/>

  <!-- Two buttons (echo the original two-button layout) -->
  <circle cx="100" cy="102" r="6" fill="#e6567f"/>
  <circle cx="28" cy="102" r="6" fill="#e6a848"/>
</svg>
