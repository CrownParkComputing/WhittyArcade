<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  MANX emblem — three-screen arcade cabinet silhouette.
  Use this as a circular/square emblem in docs, favicons, or icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="MANX emblem">
  <defs>
    <linearGradient id="emblemBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161d"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="emblemScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe9ec"/>
      <stop offset="1" stop-color="#0f8f93"/>
    </linearGradient>
    <linearGradient id="emblemMarquee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6567f"/>
      <stop offset="0.5" stop-color="#f9e2af"/>
      <stop offset="1" stop-color="#37cfd3"/>
    </linearGradient>
  </defs>

  <!-- Circular plate -->
  <circle cx="100" cy="100" r="92" fill="url(#emblemBg)" stroke="#37cfd3" stroke-width="4"/>

  <!-- Marquee top -->
  <rect x="22" y="32" width="156" height="26" rx="7" fill="url(#emblemMarquee)"/>
  <text x="100" y="52"
        font-family="'Press Start 2P','VT323','JetBrainsMono Nerd Font',monospace"
        font-size="14" font-weight="700" text-anchor="middle"
        fill="#0b0e13" letter-spacing="1.5">MANX</text>

  <!-- Three screens -->
  <g transform="translate(0,68)">
    <g transform="rotate(-7 36 38)">
      <rect x="14" y="14" width="44" height="48" rx="6" fill="url(#emblemScreen)" stroke="#37cfd3" stroke-width="2"/>
      <line x1="14" y1="22" x2="58" y2="22" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="14" y1="32" x2="58" y2="32" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="14" y1="42" x2="58" y2="42" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="14" y1="52" x2="58" y2="52" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
    </g>
    <g>
      <rect x="60" y="10" width="80" height="56" rx="7" fill="url(#emblemScreen)" stroke="#37cfd3" stroke-width="2.5"/>
      <line x1="60" y1="20" x2="140" y2="20" stroke="#8fe9ec" stroke-width="1" opacity="0.5"/>
      <line x1="60" y1="30" x2="140" y2="30" stroke="#8fe9ec" stroke-width="1" opacity="0.5"/>
      <line x1="60" y1="40" x2="140" y2="40" stroke="#8fe9ec" stroke-width="1" opacity="0.5"/>
      <line x1="60" y1="50" x2="140" y2="50" stroke="#8fe9ec" stroke-width="1" opacity="0.5"/>
      <line x1="60" y1="60" x2="140" y2="60" stroke="#8fe9ec" stroke-width="1" opacity="0.5"/>
    </g>
    <g transform="rotate(7 164 38)">
      <rect x="142" y="14" width="44" height="48" rx="6" fill="url(#emblemScreen)" stroke="#37cfd3" stroke-width="2"/>
      <line x1="142" y1="22" x2="186" y2="22" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="142" y1="32" x2="186" y2="32" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="142" y1="42" x2="186" y2="42" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
      <line x1="142" y1="52" x2="186" y2="52" stroke="#8fe9ec" stroke-width="1" opacity="0.4"/>
    </g>
  </g>

  <!-- Cabinet base -->
  <rect x="34" y="146" width="132" height="20" rx="8" fill="#243040"/>
  <rect x="34" y="146" width="132" height="10" rx="5" fill="#2f3d50"/>

  <!-- Buttons -->
  <circle cx="148" cy="156" r="5" fill="#e6567f"/>
  <circle cx="52"  cy="156" r="5" fill="#e6a848"/>

  <!-- Tagline arc at the bottom -->
  <text x="100" y="184"
        font-family="'JetBrainsMono Nerd Font','Inter',sans-serif"
        font-size="9" font-weight="600"
        fill="#a6adc8" letter-spacing="2.5"
        text-anchor="middle">MULTISCREEN · ARCADE · NEXUS</text>
</svg>
