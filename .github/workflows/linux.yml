name: CachyOS build

on:
  # Branch pushes only: a tag push is the release workflow's business, and it
  # calls this one itself rather than letting two builds race.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-cachyos:
    runs-on: ubuntu-24.04
    container:
      # CachyOS follows Arch's rolling ABI and package layout. Building in the
      # official Arch image produces a native glibc/pacman x86_64 artifact.
      image: archlinux:latest
    timeout-minutes: 45

    steps:
      - name: Install CachyOS / Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            ca-certificates \
            cmake \
            git \
            ninja \
            pkgconf \
            libglvnd \
            mesa \
            sdl3 \
            sdl3_ttf \
            openal \
            glew \
            zlib \
            minizip \
            vulkan-headers \
            vulkan-icd-loader \
            glslang \
            mpg123 \
            glm

      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Moira's generated tables are memory-heavy under parallel GCC builds.
      - name: Build MANX
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Stage Linux executable
        run: |
          package=MANX-cachyos-x86_64
          cmake -E make_directory "$package"
          cmake -E copy build/MANX "$package/MANX"
          cmake -E copy RELEASE_README.md "$package/README.md"
          cmake -E copy LICENSE "$package/LICENSE.txt"
          cmake -E copy THIRD_PARTY_NOTICES.md \
            "$package/THIRD_PARTY_NOTICES.md"
          strip --strip-unneeded "$package/MANX"
          chmod +x "$package/MANX"
          "$package/MANX" --list-roms > /dev/null
          (cd "$package" && sha256sum MANX > MANX.sha256)
          # Tarred here rather than in the release job: an uploaded artifact
          # is a zip, which loses the executable bit, so what ships has to be
          # the archive this job built and not a repack of its contents.
          tar -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Upload CachyOS x86_64 build
        uses: actions/upload-artifact@v7
        with:
          name: MANX-cachyos-x86_64
          path: |
            MANX-cachyos-x86_64.tar.gz
            MANX-cachyos-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
