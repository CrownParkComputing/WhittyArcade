name: CachyOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cachyos:
    runs-on: ubuntu-24.04
    container:
      # CachyOS follows Arch's rolling ABI and package layout. Building in the
      # official Arch image produces a native glibc/pacman x86_64 artifact.
      image: archlinux:latest
    timeout-minutes: 45

    steps:
      - name: Install CachyOS / Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            ca-certificates \
            cmake \
            git \
            ninja \
            pkgconf \
            libglvnd \
            mesa \
            sdl2-compat \
            sdl2_ttf \
            openal \
            glew \
            zlib \
            minizip \
            vulkan-headers \
            vulkan-icd-loader \
            mpg123 \
            glm

      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Moira's generated tables are memory-heavy under parallel GCC builds.
      - name: Build WhittyArcade
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Stage Linux executable
        run: |
          cmake -E make_directory artifact
          cmake -E copy build/WhittyArcade artifact/WhittyArcade
          cmake -E copy RELEASE_README.md artifact/README.md
          cmake -E copy LICENSE artifact/LICENSE.txt
          cmake -E copy THIRD_PARTY_NOTICES.md artifact/THIRD_PARTY_NOTICES.md
          chmod +x artifact/WhittyArcade
          cd artifact
          sha256sum WhittyArcade > WhittyArcade.sha256

      - name: Upload CachyOS x86_64 build
        uses: actions/upload-artifact@v7
        with:
          name: WhittyArcade-cachyos-x86_64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
