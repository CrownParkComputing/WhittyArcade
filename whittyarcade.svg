<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161d"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#8fe9ec"/>
      <stop offset="0.55" stop-color="#37cfd3"/>
      <stop offset="1" stop-color="#0f8f93"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)" stroke="#37cfd3" stroke-width="3"/>
  <!-- faint scanlines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <line x1="14" y1="26" x2="114" y2="26"/>
    <line x1="14" y1="38" x2="114" y2="38"/>
    <line x1="14" y1="50" x2="114" y2="50"/>
  </g>
  <!-- base -->
  <ellipse cx="64" cy="100" rx="36" ry="13" fill="#0f141b"/>
  <rect x="32" y="84" width="64" height="18" rx="9" fill="#243040"/>
  <rect x="32" y="84" width="64" height="9" rx="5" fill="#2f3d50"/>
  <!-- shaft -->
  <rect x="58" y="44" width="12" height="46" rx="6" fill="#8794a4"/>
  <rect x="58" y="44" width="5" height="46" rx="3" fill="#aab6c6"/>
  <!-- ball -->
  <circle cx="64" cy="38" r="20" fill="url(#ball)"/>
  <circle cx="56" cy="30" r="6" fill="#eafeff" opacity="0.85"/>
  <!-- buttons -->
  <circle cx="100" cy="94" r="7.5" fill="#e6567f"/>
  <circle cx="28" cy="94" r="7.5" fill="#e6a848"/>
</svg>
